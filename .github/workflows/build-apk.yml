name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Extract Game ZIP
        run: |
          sudo apt-get update
          sudo apt-get install -y unzip

          if [ ! -f athar-arena-project.zip ]; then
            echo "ERROR: ZIP file not found!"
            exit 1
          fi

          mkdir -p extracted
          unzip -o athar-arena-project.zip -d extracted

          if [ ! -f extracted/athar-arena/package.json ]; then
            echo "ERROR: package.json not found inside ZIP!"
            find extracted -maxdepth 3 -type f
            exit 1
          fi

      - name: Install dependencies
        working-directory: extracted/athar-arena
        run: npm install

      - name: Build web game
        working-directory: extracted/athar-arena
        run: npm run build

      - name: Setup Android
        working-directory: extracted/athar-arena
        run: |
          npx cap add android
          npx cap sync android

      - name: Build APK
        working-directory: extracted/athar-arena/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Athar-Arena-APK
          path: extracted/athar-arena/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
